name: Sora OS - ISO Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-iso:
    name: Sora OS ISO (Ubuntu 24.04 / amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build fakeroot debootstrap \
            xorriso squashfs-tools isolinux syslinux-common syslinux-utils \
            grub-efi-amd64-bin grub-pc-bin \
            dosfstools mtools \
            ubuntu-keyring debian-archive-keyring

      - name: Disk kontrolü
        run: df -h

      - name: ISO üret (live-build)
        run: |
          set +e
          bash build/live/build.sh 2>&1 | tee /tmp/sora-build.log
          status=$?
          set -e
          if [[ $status -ne 0 ]] || [[ ! -f build/live/live-image-amd64.hybrid.iso ]]; then
            echo "===== lb build log (son 100 satir) ====="
            tail -n 100 build/live/lb-build.log 2>/dev/null || tail -n 100 /tmp/sora-build.log
            echo "===== BUILD BASARISIZ (cikis: $status) ====="
            exit 1
          fi
          echo "==> ISO uretildi"

      - name: ISO artefakt olarak yükle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sora-OS-ISO
          path: |
            build/live/live-image-amd64.hybrid.iso
            build/live/lb-build.log
          if-no-files-found: warn
          retention-days: 14
