# Sora OS - Çekirdek performans ayarları
# Ayrıntılar: docs/TUNING-NOTES.md

# zram ile takas ucuz olduğundan bellek sıkıştırmayı agresif kullan
vm.swappiness=100
vm.vfs_cache_pressure=50
vm.page-cluster=0
vm.watermark_scale_factor=125
vm.max_map_count=1048576
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# NMI watchdog'u kapat (sürekli CPU tüketimini önler)
kernel.nmi_watchdog=0

# Dosya izleme limitleri (Electron/Brave ve oyunlar için)
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024

# Ağ (BBR - daha iyi tıkanıklık yönetimi)
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
